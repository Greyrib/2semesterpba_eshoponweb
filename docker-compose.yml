version: '3.4'

services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y

  sqlserverCatalog:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1434:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y
    networks:
      - CatalogDbNetwork

  catalogmicroservice:
    image: ${DOCKER_REGISTRY-}catalogmicroservice
    build:
      context: .
      dockerfile: CatalogMicroservice/Dockerfile
    depends_on:
      sqlserverCatalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - CatalogDbNetwork

  basketmicroservice:
    image: ${DOCKER_REGISTRY-}basketmicroservice
    build:
      context: .
      dockerfile: BasketMicroservice/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  CatalogDbNetwork:
    driver: bridge