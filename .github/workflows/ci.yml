name: Pull Request

on:
  pull_request:
    branches: [main, main_AIli]

jobs:
  workflow_job:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies API
        run: dotnet restore ./tests/UnitTests/UnitTests.csproj

      - name: Build code API
        run: dotnet build ./tests/UnitTests/UnitTests.csproj --no-restore

      - name: Run unit tests
        run: dotnet test ./tests/UnitTests/UnitTests.csproj --no-build --verbosity normal

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format Everything.sln --verify-no-changes --verbosity diagnostic

  code-quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./tests/UnitTests/UnitTests.csproj

      - name: Run analyzers (fail on warnings)
        run: dotnet build ./tests/UnitTests/UnitTests.csproj --no-restore /p:EnableNETAnalyzers=true /p:AnalysisLevel=latest #/p:TreatWarningsAsErrors=true

