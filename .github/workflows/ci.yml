name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  workflow_job:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies API
        run: dotnet restore /tests/UnitTests.csproj

      - name: Build code API
        run: dotnet build /tests/UnitTests.csproj --no-restore

      - name: Run unit tests
        run: dotnet test /tests/UnitTests.csproj --no-build --verbosity normal

